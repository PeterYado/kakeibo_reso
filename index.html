<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RESO — 支出解像</title>

<!-- ============================================================
     アイコン設定 ／ どのアイコンがどこに出るか
     ------------------------------------------------------------
     favicon.svg          … PCブラウザの【タブ】とブックマーク（モダンブラウザ）
     favicon-32.png       … 同上のフォールバック（SVG非対応の古いブラウザ）
     apple-touch-icon.png … iPhone/iPad「ホーム画面に追加」の【アプリアイコン】
                             ※iOSはSVG不可・180×180のPNG／角丸はOS側で付く
     icon-192.png         … Android のホーム画面／PWA一覧（manifest経由）
     icon-512.png         … Android の起動スプラッシュ・大きい表示（manifest経由）
     manifest.webmanifest … アプリ名・テーマ色・全画面表示などの設定
     ※すべて index.html と同じ階層に置くこと（相対パス）
     ============================================================ -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17212B">
<!-- iOSホーム画面から開いたときブラウザUIなしで起動（アプリらしく） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RESO">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#EFF2F5; --surface:#FFFFFF; --surface2:#F7F9FB;
    --ink:#17212B; --ink2:#56646F; --ink3:#8A97A1;
    --line:#Dce3e9; --line2:#C7D0D8;
    --amber:#A8690A; --amber-bg:#F5EAD6; --amber-line:#E4C892;
    --crimson:#A3374A; --crimson-bg:#F1DFE2;
    --ok:#0E7C6B;
    --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --sans:"IBM Plex Sans JP", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    --maxw:480px;
    --nav-h:64px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:var(--sans); background:#DEE3E8; color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.45;
  }
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em;}
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}

  /* ---- app shell ---- */
  /* ---- auth ---- */
  #auth{position:fixed; inset:0; z-index:100; background:#DEE3E8; display:flex; align-items:center; justify-content:center; padding:20px;}
  #auth.hidden{display:none;}
  .authcard{width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:28px 24px; box-shadow:0 24px 60px rgba(23,33,43,.14);}
  .authbrand{display:flex; flex-direction:column; align-items:center; gap:3px; margin-bottom:6px;}
  .authsub{text-align:center; font-size:12.5px; color:var(--ink3); margin:8px 0 22px;}
  #auth .fl{display:block; font-size:12px; color:var(--ink2); margin:0 0 5px 2px;}
  #auth .tin{margin-top:0;}
  .autherr{color:var(--crimson); font-size:12px; min-height:16px; margin:8px 2px 0;}
  .authbtn{width:100%; height:48px; margin-top:14px; border:0; border-radius:12px; background:var(--amber); color:#fff;
    font-size:15px; font-weight:600; box-shadow:0 6px 16px rgba(168,105,10,.26);}
  .authbtn:disabled{background:var(--line2); box-shadow:none;}
  .authbtn:not(:disabled):active{transform:translateY(1px);}
  .authswap{width:100%; height:40px; margin-top:8px; border:0; background:none; color:var(--ink2); font-size:12.5px;}
  .authswap:hover{color:var(--amber);}

  /* sync badge */
  .sync{display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--ink3); font-family:var(--mono);}
  .sync .dot{width:7px; height:7px; border-radius:50%; background:var(--line2);}
  .sync.s-ok .dot{background:var(--ok);} .sync.s-ok{color:var(--ok);}
  .sync.s-save .dot{background:var(--amber);} .sync.s-save{color:var(--amber);}
  .sync.s-err .dot{background:var(--crimson);} .sync.s-err{color:var(--crimson);}

  .app{max-width:var(--maxw); margin:0 auto; min-height:100dvh; background:var(--paper);
    box-shadow:0 0 0 1px var(--line), 0 24px 60px rgba(23,33,43,.10); position:relative;
    display:flex; flex-direction:column;}
  .head{padding:18px 18px 14px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
  .brand{display:flex; flex-direction:column; gap:2px;}
  .wordmark{font-family:var(--mono); font-weight:600; font-size:20px; letter-spacing:.12em; color:var(--ink);}
  .wordmark b{color:var(--amber); font-weight:600;}
  .subttl{font-size:11px; color:var(--ink3); letter-spacing:.14em;}
  .periodwrap{display:flex; flex-direction:column; align-items:flex-end; gap:5px;}
  .period{display:flex; align-items:center; gap:2px; background:var(--surface); border:1px solid var(--line);
    border-radius:10px; padding:4px 4px; box-shadow:0 1px 0 rgba(23,33,43,.03);}
  .period button{background:none; border:0; width:28px; height:28px; border-radius:7px; color:var(--ink2);
    display:grid; place-items:center;}
  .period button:hover{background:var(--surface2); color:var(--ink);}
  .period .pv{font-family:var(--mono); font-size:12.5px; padding:0 8px; width:auto; min-width:78px; height:28px;
    display:grid; place-items:center; text-align:center; color:var(--ink);}
  .period .pv.past{color:var(--amber);}
  .backtoday{background:var(--amber-bg); border:1px solid var(--amber-line); color:var(--amber);
    font-size:11px; font-family:var(--mono); letter-spacing:.02em; padding:3px 10px; border-radius:999px;
    display:inline-flex; align-items:center; gap:5px;}
  .backtoday::before{content:"↩"; font-family:var(--sans);}
  .backtoday:hover{background:var(--amber); color:#fff; border-color:var(--amber);}
  .backtoday[hidden]{display:none;}

  .main{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:0 16px calc(var(--nav-h) + 24px);}
  .view{display:none;}
  .view.on{display:block; animation:fade .28s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  /* ---- 解像 (drill-down) ---- */
  .readout{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 16px 14px;
    box-shadow:0 1px 0 rgba(23,33,43,.03);}
  .rail{display:flex; flex-wrap:wrap; align-items:center; gap:2px; margin-bottom:12px;}
  .rail button{background:none; border:0; padding:3px 7px; border-radius:7px; font-size:12.5px; color:var(--ink2);
    display:inline-flex; align-items:center; gap:6px;}
  .rail button:hover{background:var(--surface2);}
  .rail .cur{color:var(--amber); background:var(--amber-bg); font-weight:600;}
  .rail .sep{color:var(--ink3); font-size:11px; padding:0 1px; user-select:none;}
  .rlabel{font-size:12px; color:var(--ink3); letter-spacing:.06em; margin-bottom:2px;}
  .rtotal{display:flex; align-items:baseline; gap:8px;}
  .rtotal .yen{font-family:var(--mono); font-size:13px; color:var(--ink2); align-self:flex-start; margin-top:6px;}
  .rtotal .amt{font-family:var(--mono); font-weight:600; font-size:34px; line-height:1; color:var(--ink);}
  .rtotal .shr{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--ink2);
    background:var(--surface2); border:1px solid var(--line); border-radius:999px; padding:3px 9px; align-self:center;}

  /* 収支バー */
  .balance{width:100%; margin-top:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; display:flex; align-items:center; gap:10px; text-align:left; box-shadow:0 1px 0 rgba(23,33,43,.03); position:relative;}
  .balance:hover{border-color:var(--line2);}
  .balance .bcol{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .balance .bk{font-size:10.5px; color:var(--ink3); letter-spacing:.06em;}
  .balance .bv{font-family:var(--mono); font-size:14px; font-weight:500; color:var(--ink); white-space:nowrap;}
  .balance .bv.in{color:var(--ok);}
  .balance .bv.out{color:var(--ink);}
  .balance .bv.net.pos{color:var(--ok);}
  .balance .bv.net.neg{color:var(--crimson);}
  .balance .bop{font-family:var(--mono); color:var(--ink3); font-size:13px; align-self:flex-end; padding-bottom:1px;}
  .balance .bedit{margin-left:auto; align-self:center; font-size:11px; font-family:var(--mono); color:var(--amber);
    background:var(--amber-bg); border:1px solid var(--amber-line); border-radius:999px; padding:3px 9px; white-space:nowrap;}
  .balance.empty .bedit{color:var(--amber);}

  /* 収入モーダル */
  .modal-bg{position:fixed; inset:0; z-index:60; background:rgba(23,33,43,.42); display:flex; align-items:flex-end; justify-content:center;}
  .modal-bg[hidden]{display:none;}
  .isheet{width:100%; max-width:var(--maxw); max-height:88dvh; background:var(--paper); border-radius:18px 18px 0 0;
    display:flex; flex-direction:column; overflow:hidden;}
  .isheet-scroll{overflow-y:auto; flex:1 1 auto; padding:18px 16px 0; min-height:0;}
  .ihead{display:flex; align-items:center; justify-content:space-between;}
  .ihead h2{font-size:16px; font-weight:600;}
  .ix{background:none; border:0; font-size:22px; color:var(--ink3); width:32px; height:32px;}
  #incomeNote{margin:6px 0 14px;}
  .irow{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .irow .ilabel{flex:1 1 auto; margin-top:0; height:44px;}
  .irow .iamt{flex:0 0 44%; display:flex; align-items:center; border:1px solid var(--line2); border-radius:11px;
    background:var(--surface); padding-left:11px; height:44px;}
  .irow .iamt .pfx{font-family:var(--mono); color:var(--ink2);}
  .irow .iamtin{border:0; background:none; height:42px; width:100%; padding:0 10px; font-size:15px; text-align:right; color:var(--ink);}
  .irow .iamtin:focus{outline:none;}
  .irow .iamt:focus-within{border-color:var(--ok); box-shadow:0 0 0 3px rgba(14,124,107,.14);}
  .iformbar{flex:0 0 auto; background:var(--paper); border-top:1px solid var(--line2); padding:12px 16px calc(12px + env(safe-area-inset-bottom));}
  .irow-sum{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; font-size:13px; color:var(--ink2);}
  .irow-sum .num{font-size:17px; font-weight:600; color:var(--ok);}

  .fieldhead{display:flex; justify-content:space-between; align-items:baseline; margin:20px 4px 8px;}
  .fieldhead .t{font-size:12px; color:var(--ink3); letter-spacing:.1em;}
  .fieldhead .c{font-family:var(--mono); font-size:11px; color:var(--ink3);}

  .seg{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px 13px; margin-bottom:8px; text-align:left; display:block; position:relative; overflow:hidden;
    box-shadow:0 1px 0 rgba(23,33,43,.02); transition:border-color .15s, transform .06s;}
  .seg:hover{border-color:var(--line2);}
  .seg:active{transform:scale(.995);}
  .seg .r1{display:flex; align-items:center; gap:10px; position:relative; z-index:1;}
  .seg .nm{font-size:14.5px; font-weight:500; color:var(--ink); flex:1 1 auto; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .seg .pct{font-family:var(--mono); font-size:11.5px; color:var(--ink2); min-width:42px; text-align:right;}
  .seg .val{font-family:var(--mono); font-weight:500; font-size:14px; color:var(--ink); min-width:78px; text-align:right;}
  .seg .drill{color:var(--ink3); flex:0 0 auto; display:grid; place-items:center;}
  .seg .bar{position:relative; z-index:1; height:5px; border-radius:3px; background:var(--surface2); margin-top:9px; overflow:hidden;}
  .seg .bar>i{position:absolute; inset:0 auto 0 0; width:0; background:var(--amber); border-radius:3px;
    transition:width .55s cubic-bezier(.22,.61,.36,1);}
  .seg.big .bar>i{background:var(--crimson);}

  /* monthly chart */
  .mchart{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 14px 10px; margin-top:10px;
    box-shadow:0 1px 0 rgba(23,33,43,.03);}
  .mhead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
  .mhead .t{font-size:12px; color:var(--ink3); letter-spacing:.06em;}
  .mhead .t b{color:var(--ink2); font-weight:600;}
  .mhead .t .myear{color:var(--ink); font-weight:600; font-size:13px;}
  .mhead .t .ytot{color:var(--ink2); font-size:11.5px; margin-left:4px;}
  .mhead .c{font-family:var(--mono); font-size:11px; color:var(--ink3);}
  .mbars{display:flex; align-items:flex-end; gap:5px; height:96px;}
  .mbar{flex:1 1 0; background:none; border:0; padding:0; display:flex; flex-direction:column; align-items:center; gap:6px;
    height:100%; justify-content:flex-end;}
  .mbar .mcol{width:100%; flex:1 1 auto; display:flex; align-items:flex-end; justify-content:center;}
  .mbar .mcol>i{display:block; width:100%; max-width:22px; border-radius:4px 4px 2px 2px; background:var(--line2);
    transition:height .5s cubic-bezier(.22,.61,.36,1), background .15s;}
  .mbar .mlab{font-family:var(--mono); font-size:10px; color:var(--ink3);}
  .mbar:hover .mcol>i{background:var(--ink3);}
  .mbar.cur .mcol>i{background:var(--amber);}
  .mbar.cur .mlab{color:var(--amber); font-weight:600;}
  .mbar.peak .mcol>i{box-shadow:inset 0 0 0 1.5px var(--ink);}

  /* leaf transactions */
  .leafrow{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 13px;
    margin-bottom:8px; display:flex; align-items:center; gap:12px;}
  .leafrow .d{font-family:var(--mono); font-size:11px; color:var(--ink3); flex:0 0 auto;}
  .leafrow .nm{font-size:14px; flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .leafrow .val{font-family:var(--mono); font-weight:500; font-size:14px; text-align:right;}

  .empty{text-align:center; color:var(--ink3); padding:48px 20px; font-size:13.5px;}
  .empty .big{font-size:15px; color:var(--ink2); margin-bottom:6px;}

  /* ---- 記録 (entry) ---- */
  .amtcard{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:2px;}
  .amtcard .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .amtcard .lab{font-size:12px; color:var(--ink3); letter-spacing:.08em;}
  .amtdisp{display:flex; align-items:baseline; gap:8px; padding:6px 2px 2px;}
  .amtdisp .yen{font-family:var(--mono); font-size:18px; color:var(--ink2);}
  .amtdisp .v{font-family:var(--mono); font-weight:600; font-size:40px; line-height:1; color:var(--ink);}
  .amtdisp.zero .v{color:var(--ink3);}
  .taxnote{font-family:var(--mono); font-size:11.5px; color:var(--amber); min-height:16px; padding-left:2px;}

  .toggle{display:inline-flex; border:1px solid var(--line2); border-radius:9px; overflow:hidden;}
  .toggle button{background:var(--surface); border:0; padding:6px 12px; font-size:12px; color:var(--ink2); font-family:var(--mono);}
  .toggle button.on{background:var(--ink); color:#fff;}

  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
  .keypad button{background:var(--surface); border:1px solid var(--line); border-radius:12px; height:52px;
    font-family:var(--mono); font-size:20px; color:var(--ink); box-shadow:0 1px 0 rgba(23,33,43,.03);}
  .keypad button:hover{border-color:var(--line2);}
  .keypad button:active{background:var(--surface2);}
  .keypad button.wide{grid-column:span 1;}
  .keypad button.del{color:var(--crimson); font-size:18px;}

  .seclab{font-size:12px; color:var(--ink3); letter-spacing:.1em; margin:20px 4px 8px;}

  /* date row */
  .daterow{display:flex; gap:8px; align-items:stretch;}
  .datein{margin-top:0; flex:1 1 auto; -webkit-appearance:none; appearance:none;
    font-family:var(--mono); color:var(--ink);}
  .todaybtn{flex:0 0 auto; padding:0 16px; border:1px solid var(--line2); border-radius:11px; background:var(--surface);
    color:var(--ink2); font-size:13px; font-family:var(--sans);}
  .todaybtn:hover{border-color:var(--amber-line); color:var(--amber);}
  .todaybtn.on{background:var(--amber-bg); border-color:var(--amber-line); color:var(--amber); font-weight:600;}

  /* item rows (多品目) */
  .itemrow{background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:11px 12px; margin-bottom:8px;
    box-shadow:0 1px 0 rgba(23,33,43,.02);}
  .ir-top{display:flex; align-items:center; gap:8px;}
  .ir-name{margin-top:0; flex:1 1 auto; height:42px;}
  .ir-del{flex:0 0 auto; width:34px; height:34px; border:1px solid var(--line); border-radius:9px; background:var(--surface);
    color:var(--ink3); font-size:13px;}
  .ir-del:hover{border-color:var(--crimson); color:var(--crimson);}
  .ir-bot{display:flex; align-items:center; gap:8px; margin-top:9px;}
  .ir-price{flex:1 1 auto; display:flex; align-items:center; border:1px solid var(--line2); border-radius:10px;
    background:var(--surface); padding-left:10px; height:42px; min-width:0;}
  .ir-price .pfx{font-family:var(--mono); color:var(--ink2); font-size:14px;}
  .ir-in{border:0; background:none; height:40px; width:100%; padding:0 8px; font-size:15px; text-align:right; color:var(--ink); min-width:0;}
  .ir-in:focus{outline:none;}
  .ir-price:focus-within{border-color:var(--amber-line); box-shadow:0 0 0 3px var(--amber-bg);}
  .ir-x, .ir-eq{color:var(--ink3); font-family:var(--mono); font-size:13px; flex:0 0 auto;}
  .ir-qty{display:flex; align-items:center; border:1px solid var(--line2); border-radius:10px; overflow:hidden; flex:0 0 auto;}
  .ir-qty .qbtn{width:32px; height:42px; border:0; background:var(--surface); color:var(--ink2); font-size:18px;}
  .ir-qty .qbtn:hover{background:var(--surface2);}
  .ir-qin{width:38px; height:42px; border:0; border-left:1px solid var(--line); border-right:1px solid var(--line);
    background:var(--surface); text-align:center; font-size:15px; color:var(--ink);}
  .ir-qin:focus{outline:none; background:var(--amber-bg);}
  .ir-sum{flex:0 0 auto; min-width:72px; text-align:right; font-family:var(--mono); font-weight:500; font-size:14px; color:var(--ink);}
  .additem{width:100%; height:44px; border:1px dashed var(--line2); border-radius:11px; background:var(--surface);
    color:var(--ink2); font-size:13px; margin-top:2px;}
  .additem:hover{border-color:var(--amber-line); color:var(--amber);}

  /* 繰り返し */
  .repeatbox{margin-top:18px; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:14px;}
  .repeatbox.on{border-color:var(--amber-line);}
  .repeattoggle{display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
  .repeattoggle .rt-txt{font-size:14px; font-weight:500; color:var(--ink);}
  .switch{width:44px; height:26px; border-radius:999px; background:var(--line2); position:relative; transition:background .18s; flex:0 0 auto;}
  .switch .knob{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .18s; box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .switch.on{background:var(--amber);}
  .switch.on .knob{left:21px;}
  .rep-note{font-size:12px; color:var(--ink3); margin:12px 0 10px; line-height:1.5;}
  .rep-ends{display:flex; gap:6px; flex-wrap:wrap;}
  .rep-end{flex:1 1 0; min-width:0; padding:9px 6px; border:1px solid var(--line2); border-radius:9px; background:var(--surface);
    color:var(--ink2); font-size:12.5px; white-space:nowrap;}
  .rep-end.on{background:var(--amber-bg); border-color:var(--amber-line); color:var(--amber); font-weight:600;}
  .rep-detail{display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; color:var(--ink2); flex-wrap:wrap;}
  .rep-detail .rep-in{margin-top:0;}

  /* 範囲選択モーダル */
  .scope-btns{display:flex; flex-direction:column; gap:9px; margin-top:6px; padding-bottom:8px;}
  .scope-b{text-align:left; padding:14px; border:1px solid var(--line2); border-radius:12px; background:var(--surface);

<script>
/* ============================================================
   RESO — スケルトン（骨組み）
   ※ まだ Supabase 未接続。データはメモリ上のみ（再読込で初期化）。
   ※ 目的：全体構造・デザイン・シグネチャ操作（解像ドリルダウン）の確認。
   ============================================================ */

/* ---- mock data: フラットな取引（これがそのまま将来のデータモデル） ---- */
/* level: cat（費目）> sub（区分）> shop（店）> item（品目） */
const LEVELS = ['cat','sub','shop','item'];
const LEVEL_LABEL = {cat:'費目', sub:'区分', shop:'店', item:'品目'};

let TX = [];   // クラウド(kakeibo_tx)から読み込む

function tx(date, amount, cat, sub, shop, item, taxRate, active, ruleId){
  return {id:'t'+Math.random().toString(36).slice(2,9), date, amount, cat, sub, shop, item, taxRate:taxRate||null,
    active: active!==false, ruleId: ruleId||null};
}

/* ---- 収入（月別・複数行・支出とは別軸） ---- */
let INCOME = [];   // {id, ym:'YYYY-MM', label, amount}
function incomeInMonth(ym){ return INCOME.filter(x=>x.ym===ym); }
function incomeTotal(ym){ return incomeInMonth(ym).reduce((s,x)=>s+(x.amount||0),0); }

/* ---- 繰り返し（毎月の定期支出） ---- */
let RULES = [];   // {id, amount, cat, sub, shop, item, taxRate, freq, startDate, endKind, endCount, endYm, active}
const FUTURE_MONTHS = 12;   // forever ルールで先に用意しておく月数

// startDate から n 回目（0始まり）の日付。毎月：同じ日、月末調整あり
function ruleDateAt(rule, n){
  const [y,m,d] = rule.startDate.split('-').map(Number);
  const base = new Date(Date.UTC(y, m-1+n, 1));
  const yy = base.getUTCFullYear(), mm = base.getUTCMonth();
  const lastDay = new Date(Date.UTC(yy, mm+1, 0)).getUTCDate();  // その月の末日
  const day = Math.min(d, lastDay);                              // 31日→末日に丸め
  return yy + '-' + String(mm+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
}
// このルールが生成すべき全日付（endKind に従う）。ただし forever は「今日＋FUTURE_MONTHS」まで
function ruleDates(rule){
  const dates = [];
  const horizon = jstDate(); // 今日
  const [hy,hm] = horizon.split('-').map(Number);
  const horizonYm = (new Date(Date.UTC(hy, hm-1+FUTURE_MONTHS, 1)));
  const horizonCap = horizonYm.getUTCFullYear()+'-'+String(horizonYm.getUTCMonth()+1).padStart(2,'0');
  for(let n=0; n<600; n++){   // 上限（安全弁）
    if(rule.endKind==='count' && n>=rule.endCount) break;
    const dt = ruleDateAt(rule, n);
    if(rule.endKind==='until' && dt.slice(0,7) > rule.endYm) break;
    if(rule.endKind==='forever' && dt.slice(0,7) > horizonCap) break;
    dates.push(dt);
  }
  return dates;
}
// ルールに沿って未生成分の tx を作る（過去～今日=活性 / 未来=予定）。返り値: 追加した行の配列
function buildRuleTx(rule){
  const today = jstDate();
  const existing = new Set(TX.filter(t=>t.ruleId===rule.id).map(t=>t.date));
  const rows = [];
  ruleDates(rule).forEach(dt=>{
    if(existing.has(dt)) return;
    rows.push({date:dt, amount:rule.amount, cat:rule.cat, sub:rule.sub||'（未設定）',
      shop:rule.shop||'（未設定）', item:rule.item||'（品目なし）', taxRate:rule.taxRate,
      active: dt<=today, ruleId:rule.id});
  });
  return rows;
}
// 全 active ルールについて、未来分の予定が足りていなければ補充（起動時）
function ensureFuture(){
  let allRows = [];
  RULES.filter(r=>r.active).forEach(r=>{ allRows = allRows.concat(buildRuleTx(r)); });
  if(!allRows.length) return Promise.resolve();
  return insertTx(allRows);
}

/* ---- category tree (設定の커스터마이징 대상・kakeibo_settingsから読み込む) ---- */
const DEFAULT_CAT_TREE = {
  '食費':['コンビニ','外食','スーパー','カフェ'],
  '日用品':['ドラッグストア','100均','雑貨'],
  '趣味':['オーディオ','映画・書籍','サブスク','ゲーム'],
  '交通':['電車','バス','タクシー'],
  'その他':[],
};
let CAT_TREE = JSON.parse(JSON.stringify(DEFAULT_CAT_TREE));

/* ---- JST（日本時間）基準の日付。toISOString()はUTCで日付がずれるため使わない ---- */
function jstDate(d){                 // d省略で「今」→ YYYY-MM-DD（JST）
  const t = d ? new Date(d) : new Date();
  const jst = new Date(t.getTime() + 9*3600*1000);   // UTC+9
  return jst.toISOString().slice(0,10);
}
function jstToday(){ return jstDate(); }
function jstMonth(){ return jstDate().slice(0,7); }

/* ---- state ---- */
const THIS_MONTH = jstMonth();   // 今月（JST・固定）
let period = jstMonth();   // 今月（JST）
let path = [];            // 解像ドリルダウンの現在パス
let TAB = 'lens';

/* ---- helpers ---- */
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
function periodLabel(p){ return p.replace('-',' / '); }
function inPeriod(){ return TX.filter(t => t.date.slice(0,7) === period); }
function inPeriodActive(){ return TX.filter(t => t.date.slice(0,7) === period && t.active!==false); }
function matchPath(t){ return path.every((v,i) => t[LEVELS[i]] === v); }

/* 現在のドリルダウン path に一致する取引を、選択中の月が属する「年の1〜12月」で集計（活性のみ） */
function yearlySeries(){
  const year = parseInt(period.slice(0,4),10);
  const months = [];
  for(let m=1;m<=12;m++) months.push(year + '-' + String(m).padStart(2,'0'));
  const sums = {};
  TX.forEach(t=>{
    if(t.active===false) return;                          // 予定は集計しない
    if(!path.every((v,i)=> t[LEVELS[i]] === v)) return;   // path 배율 반영
    const mk = t.date.slice(0,7);
    if(months.includes(mk)) sums[mk] = (sums[mk]||0) + t.amount;
  });
  return {year, series: months.map(mk=>({mk, v:sums[mk]||0}))};
}

function aggregate(){
  const rows = inPeriodActive().filter(matchPath);        // 予定を除いた活性のみ
  const total = rows.reduce((s,t)=>s+t.amount,0);
  const key = LEVELS[path.length];               // 次の階層のキー
  if(!key){ // 末端：個別取引
    return {total, leaf:true, rows:rows.slice().sort((a,b)=>b.date.localeCompare(a.date))};
  }
  const map = {};
  rows.forEach(t=>{ const k=t[key]||'（未設定）'; map[k]=(map[k]||0)+t.amount; });
  const children = Object.entries(map).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  return {total, leaf:false, key, children};
}

/* ============================================================
   render: 解像
   ============================================================ */
function renderLens(){
  const el = document.getElementById('v-lens');
  const monthEmpty = inPeriodActive().length === 0;
  const periodTotal = inPeriodActive().reduce((s,t)=>s+t.amount,0);
  const ag = aggregate();

  // rail
  let rail = '<button data-i="0" class="'+(path.length===0?'cur':'')+'">全体</button>';
  path.forEach((v,i)=>{
    rail += '<span class="sep">›</span>';
    rail += '<button data-i="'+(i+1)+'" class="'+(i===path.length-1?'cur':'')+'">'+esc(v)+'</button>';
  });

  const label = path.length ? path.map(esc).join(' › ') : '全体';
  const share = periodTotal ? Math.round(ag.total/periodTotal*100) : 0;

  let html = '<div class="readout">'
    + '<div class="rail">'+rail+'</div>'
    + '<div class="rlabel">'+label+'</div>'
    + '<div class="rtotal"><span class="yen">¥</span><span class="amt">'+Math.round(ag.total).toLocaleString('ja-JP')+'</span>'
    + (path.length ? '<span class="shr">全体の '+share+'%</span>' : '<span class="shr">'+period.slice(5)+'月</span>')
    + '</div></div>';

  // 収支バー（全体表示のときだけ・顕微鏡には混ぜない）
  if(path.length===0){
    const income = incomeTotal(period);
    const spend = periodTotal;
    const net = income - spend;
    const pos = net>=0;
    html += '<button class="balance'+(income||spend?'':' empty')+'" id="balancebtn">'
      + '<div class="bcol"><span class="bk">収入</span><span class="bv in">'+(income?yen(income):'—')+'</span></div>'
      + '<span class="bop">−</span>'
      + '<div class="bcol"><span class="bk">支出</span><span class="bv out">'+yen(spend)+'</span></div>'
      + '<span class="bop">=</span>'
      + '<div class="bcol"><span class="bk">収支</span><span class="bv net '+(pos?'pos':'neg')+'">'
      +   (income? (pos?'+':'−')+yen(Math.abs(net)) : '—')+'</span></div>'
      + '<span class="bedit">'+(income?'編集':'収入を入力')+'</span>'
      + '</button>';
  }

  // 年グラフ（現在の배율を追従）— 空月でも常に表示（他の月への手がかりになる）
  html += renderMonthly();

  if(monthEmpty){
    html += '<div class="empty"><div class="big">この月の記録はまだありません</div>'
      + 'グラフの棒をタップして他の月を見るか、下の「記録」から支出を残しましょう。</div>';
    el.innerHTML = html;
    bindLensEvents(el);
    return;
  }

  if(ag.leaf){
    html += '<div class="fieldhead"><span class="t">取引</span><span class="c">'+ag.rows.length+' 件</span></div>';
    ag.rows.forEach(t=>{
      html += '<div class="leafrow"><span class="d">'+t.date.slice(5).replace('-','/')+'</span>'
        + '<span class="nm">'+esc(t.item)+'</span>'
        + '<span class="val">'+yen(t.amount)+'</span></div>';
    });
  } else {
    const maxv = ag.children[0] ? ag.children[0].v : 1;
    html += '<div class="fieldhead"><span class="t">'+LEVEL_LABEL[ag.key].toUpperCase()+' 別</span>'
      + '<span class="c">タップで拡大 ⊕</span></div>';
    ag.children.forEach((c,idx)=>{
      const pct = ag.total ? Math.round(c.v/ag.total*100) : 0;
      const w = maxv ? Math.max(4, Math.round(c.v/maxv*100)) : 0;
      const big = c.v/ (ag.total||1) >= 0.5;
      html += '<button class="seg'+(big?' big':'')+'" data-k="'+esc(c.k)+'">'
        + '<div class="r1"><span class="nm">'+esc(c.k)+'</span>'
        + '<span class="pct">'+pct+'%</span>'
        + '<span class="val">'+yen(c.v)+'</span>'
        + '<span class="drill"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span></div>'
        + '<div class="bar"><i data-w="'+w+'"></i></div>'
        + '</button>';
    });
  }

  el.innerHTML = html;
  bindLensEvents(el);
}

function bindLensEvents(el){
  el.querySelectorAll('.rail button').forEach(b=>{
    b.onclick = ()=>{ path = path.slice(0, parseInt(b.dataset.i)); renderLens(); };
  });
  el.querySelectorAll('.seg').forEach(b=>{
    b.onclick = ()=>{ path = path.concat([b.dataset.k]); renderLens(); };
  });
  el.querySelectorAll('.mbar').forEach(b=>{
    b.onclick = ()=>{ if(b.dataset.mk!==period){ period=b.dataset.mk;
      updatePeriodUI(); renderLens(); } };
  });
  const bb=el.querySelector('#balancebtn'); if(bb) bb.onclick=openIncome;

  // animate bars (zoom feel)
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  requestAnimationFrame(()=>{
    el.querySelectorAll('.bar>i').forEach(i=>{
      if(reduce){ i.style.width = i.dataset.w + '%'; }
      else { i.style.width = '0%'; requestAnimationFrame(()=>{ i.style.width = i.dataset.w + '%'; }); }
    });
    if(!reduce){
      el.querySelectorAll('.mbar .mcol>i').forEach(i=>{ const h=i.style.height; i.style.height='0%';
        requestAnimationFrame(()=>{ i.style.height=h; }); });
    }
  });
}

function renderMonthly(){
  const {year, series} = yearlySeries();
  const max = Math.max(1, ...series.map(s=>s.v));
  const peak = series.reduce((a,b)=> b.v>a.v?b:a, series[0]);
  const yearTotal = series.reduce((s,x)=>s+x.v,0);
  const scope = path.length ? path[path.length-1] : '全体';

  let bars = '';
  series.forEach(s=>{
    const h = s.v ? Math.max(3, Math.round(s.v/max*100)) : 0;
    const isCur = s.mk===period;
    const isPeak = s.v>0 && s.mk===peak.mk;
    const cls = 'mbar' + (isCur?' cur':'') + (isPeak?' peak':'');
    bars += '<button class="'+cls+'" data-mk="'+s.mk+'" title="'+s.mk+'　'+yen(s.v)+'">'
      + '<span class="mcol"><i style="height:'+h+'%"></i></span>'
      + '<span class="mlab">'+parseInt(s.mk.slice(5),10)+'</span>'
      + '</button>';
  });

  const peakTxt = yearTotal>0 ? '最多 '+parseInt(peak.mk.slice(5),10)+'月 · '+yen(peak.v) : '記録なし';
  return '<div class="mchart">'
    + '<div class="mhead"><span class="t"><span class="myear num">'+year+'</span> 年 · <b>'+esc(scope)+'</b> <span class="ytot num">'+yen(yearTotal)+'</span></span>'
    + '<span class="c">'+peakTxt+'</span></div>'
    + '<div class="mbars">'+bars+'</div></div>';
}

function emptyMonth(){
  return '<div class="empty"><div class="big">この月の記録はまだありません</div>'
    + '下の「記録」から、最初の支出を残しましょう。</div>';
}

/* ============================================================
   render: 記録（入力）— 多品目（単価 × 数量）対応
   ============================================================ */
// REC.items: [{name, price:'', qty:1}]  価格は税抜/税込を taxMode で解釈
function newItem(){ return {name:'', price:'', qty:1}; }
// 記録画面の既定日付：今月を見ているなら今日、過去月なら その月の1日
function defaultRecDate(){ return period===THIS_MONTH ? jstToday() : (period+'-01'); }
let REC = {date:defaultRecDate(), taxMode:'in', cat:'', sub:'', shop:'', items:[newItem()],
  repeat:false, endKind:'forever', endCount:'', endYm:''};

function lineTotal(it){ const p=parseInt(it.price||'0',10)||0; const q=Math.max(1,parseInt(it.qty||'1',10)||1); return p*q; }
function recSubtotal(){ return REC.items.reduce((s,it)=>s+lineTotal(it),0); }
function recTotalIncl(){ const sub=recSubtotal(); return REC.taxMode==='out'?Math.round(sub*1.1):sub; }

function renderRec(){
  const el = document.getElementById('v-rec');
  const cats = Object.keys(CAT_TREE);
  const subs = REC.cat ? (CAT_TREE[REC.cat]||[]) : [];
  const sub = recSubtotal();
  const incl = recTotalIncl();

  // 上部：合計リードアウト + 税トグル
  let html = REC.editId ? '<div class="editbanner">記録を編集中 <span>1件を上書き保存します</span></div>' : '';
  html += '<div class="amtcard">'
    + '<div class="top"><span class="lab">合計</span>'
    + '<div class="toggle">'
    + '<button data-tax="in" class="'+(REC.taxMode==='in'?'on':'')+'">税込</button>'
    + '<button data-tax="out" class="'+(REC.taxMode==='out'?'on':'')+'">税抜</button>'
    + '</div></div>'
    + '<div class="amtdisp'+(incl===0?' zero':'')+'"><span class="yen">¥</span><span class="v">'+incl.toLocaleString('ja-JP')+'</span></div>'
    + '<div class="taxnote">'+(REC.taxMode==='out'&&sub>0 ? '税抜 '+yen(sub)+' → 税込 '+yen(incl)+'（10%）'
        : (REC.items.length>1 ? REC.items.length+' 品目' : '')) +'</div>'
    + '</div>';

  // 日付
  const isToday = REC.date===jstToday();
  html += '<div class="seclab">日付</div>'
    + '<div class="daterow">'
    + '<input class="tin datein" id="datein" type="date" value="'+esc(REC.date)+'">'
    + '<button class="todaybtn'+(isToday?' on':'')+'" id="todaybtn">今日</button>'
    + '</div>';

  // 費目
  html += '<div class="seclab">費目</div><div class="chips">'
    + cats.map(c=>'<button class="chip'+(REC.cat===c?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('')
    + '</div>';
  if(subs.length){
    html += '<div class="seclab">区分</div><div class="chips">'
      + subs.map(s=>'<button class="chip'+(REC.sub===s?' on':'')+'" data-sub="'+esc(s)+'">'+esc(s)+'</button>').join('')
      + '</div>';
  }

  // 店（共有）
  html += '<div class="seclab">店 <span class="stub">自由入力・後で自動補完</span></div>'
    + '<input class="tin" id="shopin" placeholder="例：マツモトキヨシ" value="'+esc(REC.shop)+'">';

  // 品目（複数行：単価 × 数量）
  html += '<div class="seclab">品目 <span class="stub">単価 × 数量・後で自動補完</span></div>';
  REC.items.forEach((it,idx)=>{
    const lt = lineTotal(it);
    html += '<div class="itemrow" data-idx="'+idx+'">'
      + '<div class="ir-top">'
      +   '<input class="tin ir-name" data-idx="'+idx+'" placeholder="品目（例：おしりふき）" value="'+esc(it.name)+'">'
      +   (REC.items.length>1 ? '<button class="ir-del" data-idx="'+idx+'" aria-label="この品目を削除">✕</button>' : '')
      + '</div>'
      + '<div class="ir-bot">'
      +   '<div class="ir-price"><span class="pfx">¥</span><input class="ir-in num" data-idx="'+idx+'" data-f="price" inputmode="numeric" placeholder="単価" value="'+esc(it.price)+'"></div>'
      +   '<span class="ir-x">×</span>'
      +   '<div class="ir-qty"><button class="qbtn" data-idx="'+idx+'" data-q="-">−</button>'
      +      '<input class="ir-qin num" data-idx="'+idx+'" data-f="qty" inputmode="numeric" value="'+esc(String(it.qty))+'">'
      +      '<button class="qbtn" data-idx="'+idx+'" data-q="+">＋</button></div>'
      +   '<span class="ir-eq">=</span>'
      +   '<span class="ir-sum num">'+(lt?yen(lt):'—')+'</span>'
      + '</div>'
      + '</div>';
  });
  html += REC.editId ? '' : '<button class="additem" id="additem">＋ 品目を追加</button>';

  // 繰り返し（新規・単発のときだけ。編集/複製では出さない）
  if(!REC.editId && !REC.editFrom){
    html += '<div class="repeatbox'+(REC.repeat?' on':'')+'">'
      + '<label class="repeattoggle"><span class="rt-txt">毎月くり返す</span>'
      +   '<span class="switch'+(REC.repeat?' on':'')+'" id="repToggle"><span class="knob"></span></span></label>';
    if(REC.repeat){
      html += '<div class="rep-note">この内容を毎月 '+parseInt(REC.date.slice(8),10)+'日 に記録します（未来分は「予定」として先に作成）。</div>'
        + '<div class="rep-ends">'
        + '<button class="rep-end'+(REC.endKind==='forever'?' on':'')+'" data-end="forever">ずっと</button>'
        + '<button class="rep-end'+(REC.endKind==='count'?' on':'')+'" data-end="count">回数で終了</button>'
        + '<button class="rep-end'+(REC.endKind==='until'?' on':'')+'" data-end="until">年月で終了</button>'
        + '</div>';
      if(REC.endKind==='count'){
        html += '<div class="rep-detail"><span>合計</span>'
          + '<input class="tin rep-in num" id="endCount" inputmode="numeric" placeholder="例：36" value="'+esc(REC.endCount)+'" style="max-width:110px;">'
          + '<span>回（分割払いなど）</span></div>';
      } else if(REC.endKind==='until'){
        html += '<div class="rep-detail"><span>この月まで</span>'
          + '<input class="tin rep-in" id="endYm" type="month" value="'+esc(REC.endYm||REC.date.slice(0,7))+'" style="max-width:170px;"></div>';
      }
    }
    html += '</div>';
  }

  const ok = sub>0 && REC.cat;
  const mainLabel = REC.editId ? '更新する' : (REC.editFrom ? '複製して記録する' : (REC.repeat ? 'くり返しを登録する' : '記録する'));
  html += '<div class="recbar">'
    + '<button class="rec-cancel" id="reccancel">キャンセル</button>'
    + '<button class="rec-btn" id="recbtn" '+(ok?'':'disabled')+'>'+mainLabel+'</button>'
    + '</div>';

  el.innerHTML = html;

  // events
  el.querySelectorAll('.toggle button').forEach(b=> b.onclick = ()=>{ REC.taxMode=b.dataset.tax; renderRec(); });
  el.querySelectorAll('[data-cat]').forEach(b=> b.onclick = ()=>{ REC.cat=b.dataset.cat; REC.sub=''; renderRec(); });
  el.querySelectorAll('[data-sub]').forEach(b=> b.onclick = ()=>{ REC.sub=b.dataset.sub; renderRec(); });
  const datein=document.getElementById('datein'); if(datein) datein.onchange=e=>{ REC.date=e.target.value||jstToday(); renderRec(); };
  const todaybtn=document.getElementById('todaybtn'); if(todaybtn) todaybtn.onclick=()=>{ REC.date=jstToday(); renderRec(); };
  const shopin=document.getElementById('shopin'); if(shopin) shopin.oninput=e=>REC.shop=e.target.value;

  // 品目行：名前・単価はライブ更新だが再描画しない（フォーカス維持）。合計だけ更新
  el.querySelectorAll('.ir-name').forEach(inp=> inp.oninput=e=>{ REC.items[+e.target.dataset.idx].name=e.target.value; });
  el.querySelectorAll('.ir-in, .ir-qin').forEach(inp=> inp.oninput=e=>{
    const i=+e.target.dataset.idx, f=e.target.dataset.f;
    REC.items[i][f]=e.target.value.replace(/[^0-9]/g,'');
    updateRecTotals();
  });
  el.querySelectorAll('.qbtn').forEach(b=> b.onclick=()=>{
    const i=+b.dataset.idx; let q=Math.max(1,parseInt(REC.items[i].qty||'1',10)||1);
    q += (b.dataset.q==='+'?1:-1); if(q<1)q=1; REC.items[i].qty=q; renderRec();
  });
  el.querySelectorAll('.ir-del').forEach(b=> b.onclick=()=>{ REC.items.splice(+b.dataset.idx,1); renderRec(); });
  const add=document.getElementById('additem'); if(add) add.onclick=()=>{ REC.items.push(newItem()); renderRec(); };
  const rep=document.getElementById('repToggle'); if(rep) rep.onclick=()=>{ REC.repeat=!REC.repeat; renderRec(); };
  el.querySelectorAll('[data-end]').forEach(b=> b.onclick=()=>{ REC.endKind=b.dataset.end; renderRec(); });
  const ec=document.getElementById('endCount'); if(ec) ec.oninput=e=>{ REC.endCount=e.target.value.replace(/[^0-9]/g,''); };
  const ey=document.getElementById('endYm'); if(ey) ey.onchange=e=>{ REC.endYm=e.target.value; };
  const rb=document.getElementById('recbtn'); if(rb) rb.onclick=saveRec;
  const rc=document.getElementById('reccancel'); if(rc) rc.onclick=cancelRec;
}

// 記録のキャンセル：フォームを初期化して解像へ戻る
function cancelRec(){
  REC = {date:defaultRecDate(), taxMode:'in', cat:'', sub:'', shop:'', items:[newItem()], repeat:false, endKind:'forever', endCount:'', endYm:''};
  go('lens');
}

// 再描画せず合計表示だけ更新（入力中フォーカスを保つ）
function updateRecTotals(){
  const sub=recSubtotal(), incl=recTotalIncl();
  const disp=document.querySelector('#v-rec .amtdisp'); const v=document.querySelector('#v-rec .amtdisp .v');
  if(v){ v.textContent=incl.toLocaleString('ja-JP'); disp.classList.toggle('zero', incl===0); }
  const note=document.querySelector('#v-rec .taxnote');
  if(note) note.textContent = REC.taxMode==='out'&&sub>0 ? '税抜 '+yen(sub)+' → 税込 '+yen(incl)+'（10%）'
        : (REC.items.length>1 ? REC.items.length+' 品目' : '');
  document.querySelectorAll('#v-rec .itemrow').forEach(row=>{
    const i=+row.dataset.idx; const lt=lineTotal(REC.items[i]);
    const s=row.querySelector('.ir-sum'); if(s) s.textContent = lt?yen(lt):'—';
  });
  const rb=document.getElementById('recbtn'); if(rb) rb.disabled = !(sub>0 && REC.cat);
}

function saveRec(){
  const sub=recSubtotal();
  if(!(sub>0 && REC.cat)) return;
  const d = REC.date || jstToday();   // 選択された日付（JST）
  const rate = REC.taxMode==='out'?0.10:null;
  const isFuture = d > jstToday();    // 未来日付＝予定（非活性）
  const act = !isFuture;

  // ---- 編集モード：既存の1行を上書き（update）----
  if(REC.editId){
    const it = REC.items[0];
    const lt = lineTotal(it); if(lt<=0) return;
    const amount = REC.taxMode==='out'?Math.round(lt*1.1):lt;
    // 「これ以降すべて」→ ルール内容を更新（この回以降の予定に反映）
    if(REC.ruleScope && REC.ruleScope.ruleId){
      const rid = REC.ruleScope.ruleId, fromDate = REC.ruleScope.fromDate;
      const patch = {amount, cat:REC.cat, sub:REC.sub||'（未設定）', shop:REC.shop||'（未設定）',
        item:it.name||'（品目なし）', taxRate:rate, _fromDate:fromDate};
      period = d.slice(0,7);
      REC = {date:defaultRecDate(), taxMode:'in', cat:'', sub:'', shop:'', items:[newItem()], repeat:false, endKind:'forever', endCount:'', endYm:''};
      updateRuleContent(rid, patch).then(()=>showToast('これ以降の繰り返しを更新しました'));
      updatePeriodUI(); path=[]; go('lens');
      return;
    }
    const patch = {date:d, amount, cat:REC.cat, sub:REC.sub||'（未設定）',
      shop:REC.shop||'（未設定）', item:it.name||'（品目なし）', taxRate:rate, active:act};
    const id = REC.editId;
    period = d.slice(0,7);
    REC = {date:defaultRecDate(), taxMode:'in', cat:'', sub:'', shop:'', items:[newItem()], repeat:false, endKind:'forever', endCount:'', endYm:''};
    updateTx(id, patch).then(()=>showToast((isFuture?'予定を保存しました　':'更新しました　')+yen(amount)));
    updatePeriodUI(); path=[]; go('lens');
    return;
  }

  // ---- 繰り返し：ルールを作成して予定を生成 ----
  if(REC.repeat){
    // 繰り返しは代表1品目で1ルール（定期支出は単一項目が基本）
    const it = REC.items.find(x=>lineTotal(x)>0) || REC.items[0];
    const amount = REC.taxMode==='out'?Math.round(lineTotal(it)*1.1):lineTotal(it);
    if(amount<=0) return;
    // 終了条件のバリデーション
    if(REC.endKind==='count' && !(parseInt(REC.endCount,10)>0)){ showToast('回数を入力してください'); return; }
    if(REC.endKind==='until' && !REC.endYm){ showToast('終了年月を選んでください'); return; }
    const rule = {
      amount, cat:REC.cat, sub:REC.sub||'（未設定）', shop:REC.shop||'（未設定）',
      item:it.name||'（品目なし）', taxRate:rate, freq:'monthly', startDate:d,
      endKind:REC.endKind, endCount:REC.endKind==='count'?parseInt(REC.endCount,10):null,
      endYm:REC.endKind==='until'?REC.endYm:null, active:true
    };
    period = d.slice(0,7);
    REC = {date:defaultRecDate(), taxMode:'in', cat:'', sub:'', shop:'', items:[newItem()], repeat:false, endKind:'forever', endCount:'', endYm:''};
    createRule(rule).then(()=>showToast('くり返しを登録しました　'+yen(amount)+'/月'));
    updatePeriodUI(); path=[]; go('lens');
    return;
  }

  // ---- 通常：新規記録（品目ごとに行を分割して insert）----
  const rows = [];
  REC.items.forEach(it=>{
    const lt=lineTotal(it); if(lt<=0) return;
    const amount = REC.taxMode==='out'?Math.round(lt*1.1):lt;   // 税抜入力なら税込へ
    rows.push({date:d, amount, cat:REC.cat, sub:REC.sub||'（未設定）',
      shop:REC.shop||'（未設定）', item:it.name||'（品目なし）', taxRate:rate, active:act});
  });
  if(!rows.length) return;
  const total=recTotalIncl(), n=rows.length;

  // 記録した月へ移動して結果を見せる
  period = d.slice(0,7);
  REC = {date:defaultRecDate(), taxMode:'in', cat:'', sub:'', shop:'', items:[newItem()], repeat:false, endKind:'forever', endCount:'', endYm:''};

  insertTx(rows).then(()=>{
    showToast((isFuture?'予定として保存　':'記録しました　')+yen(total)+(n>1?'（'+n+'品目）':''));
  });
  updatePeriodUI(); path=[]; go('lens');
}

/* 履歴からの編集：既存の行を「編集モード」で開く（IDそのまま・上書き保存） */
function editTx(id){
  const t = TX.find(x=>x.id===id); if(!t) return;
  // 繰り返しから生成された記録 → 適用範囲を尋ねる
  if(t.ruleId && RULES.find(r=>r.id===t.ruleId && r.active)){
    openRepeatScope(t, 'edit');
    return;
  }
  openEditForm(t, null);
}
// scope: null=単発として1件のみ / {ruleId,fromDate}=これ以降すべて
function openEditForm(t, scope){
  REC = {date:t.date, taxMode: t.taxRate?'out':'in', cat:t.cat, sub:t.sub==='（未設定）'?'':t.sub,
    shop:t.shop==='（未設定）'?'':t.shop,
    items:[{name:t.item==='（品目なし）'?'':t.item,
      price:String(t.taxRate?Math.round(t.amount/1.1):t.amount), qty:1}],
    editId:id_of(t), repeat:false, endKind:'forever', endCount:'', endYm:'',
    ruleScope: scope};
  go('rec');
}
function id_of(t){ return t.id; }

/* 繰り返し記録の編集/削除で「範囲」を尋ねるシート */
function openRepeatScope(t, mode){
  const rule = RULES.find(r=>r.id===t.ruleId);
  const modal = document.getElementById('scopeModal');
  const title = mode==='edit' ? 'この繰り返しを編集' : 'この繰り返しを削除';
  document.getElementById('scopeTitle').textContent = title;
  const box = document.getElementById('scopeBtns');
  // 3択（削除のときは「これ以降」を「以降の予定を削除」に読み替え）
  box.innerHTML =
    '<button class="scope-b" data-s="one">この記録だけ<span>'+(mode==='edit'?'この1件だけ直す':'この1件だけ消す')+'</span></button>'
    + (mode==='edit'
        ? '<button class="scope-b" data-s="after">これ以降すべて<span>この回から先の予定に反映（過去は残す）</span></button>'
        : '')
    + '<button class="scope-b danger" data-s="stop">繰り返しをやめる<span>'+(mode==='edit'?'今後の自動作成を停止（過去は残す）':'以降の予定を削除し停止（過去は残す）')+'</span></button>';
  modal.hidden=false;

/* 費目ツリー編集。方針A：過去データには触れない（入力候補のみ変更） */
function treeAction(ds){
  const cats = Object.keys(CAT_TREE);
  const ci = ds.c!=null ? +ds.c : null;
  const si = ds.s!=null ? +ds.s : null;
  const cat = ci!=null ? cats[ci] : null;

  function rebuild(order){ // 費目の順序を保った新オブジェクトを作る
    const next={}; order.forEach(k=>{ next[k]=CAT_TREE[k]; }); CAT_TREE=next;
  }

  switch(ds.act){
    case 'cadd': {
      const name=(prompt('新しい費目の名前')||'').trim(); if(!name) return;
      if(CAT_TREE[name]){ showToast('同じ名前の費目があります'); return; }
      CAT_TREE[name]=[]; break;
    }
    case 'cren': {
      const name=(prompt('費目の名前を変更', cat)||'').trim(); if(!name||name===cat) return;
      if(CAT_TREE[name]){ showToast('同じ名前の費目があります'); return; }
      const next={}; cats.forEach(k=>{ if(k===cat) next[name]=CAT_TREE[cat]; else next[k]=CAT_TREE[k]; }); CAT_TREE=next;
      break;
    }
    case 'cdel': {
      const n=CAT_TREE[cat].length;
      if(!confirm('費目「'+cat+'」'+(n?'（'+n+'区分）':'')+'を削除しますか？\n※これまでの記録はそのまま残ります。')) return;
      const next={...CAT_TREE}; delete next[cat]; CAT_TREE=next; break;
    }
    case 'cup': { if(ci<=0) return; const o=cats.slice(); [o[ci-1],o[ci]]=[o[ci],o[ci-1]]; rebuild(o); break; }
    case 'cdn': { if(ci>=cats.length-1) return; const o=cats.slice(); [o[ci+1],o[ci]]=[o[ci],o[ci+1]]; rebuild(o); break; }
    case 'sadd': {
      const name=(prompt('「'+cat+'」に追加する区分名')||'').trim(); if(!name) return;
      if(CAT_TREE[cat].includes(name)){ showToast('同じ区分があります'); return; }
      CAT_TREE[cat]=CAT_TREE[cat].concat([name]); break;
    }
    case 'sren': {
      const old=CAT_TREE[cat][si];
      const name=(prompt('区分の名前を変更', old)||'').trim(); if(!name||name===old) return;
      if(CAT_TREE[cat].includes(name)){ showToast('同じ区分があります'); return; }
      CAT_TREE[cat]=CAT_TREE[cat].map((x,i)=>i===si?name:x); break;
    }
    case 'sdel': {
      const s=CAT_TREE[cat][si];
      if(!confirm('区分「'+s+'」を削除しますか？\n※これまでの記録はそのまま残ります。')) return;
      CAT_TREE[cat]=CAT_TREE[cat].filter((_,i)=>i!==si); break;
    }
    case 'sup': { if(si<=0) return; const a=CAT_TREE[cat].slice(); [a[si-1],a[si]]=[a[si],a[si-1]]; CAT_TREE[cat]=a; break; }
    case 'sdn': { const a=CAT_TREE[cat].slice(); if(si>=a.length-1) return; [a[si+1],a[si]]=[a[si],a[si+1]]; CAT_TREE[cat]=a; break; }
    default: return;
  }
  saveSettings();
  renderSet();
}

/* ルール内容を更新（これ以降すべて）。未活性の予定分に新内容を反映 */
function updateRuleContent(ruleId, patch){
  const rule = RULES.find(r=>r.id===ruleId); if(!rule) return Promise.resolve();
  Object.assign(rule, patch);                       // ローカル反映
  // まだ活性化していない予定分を新内容へ更新
  const fromDate = patch._fromDate || jstToday();
  const targets = TX.filter(t=>t.ruleId===ruleId && t.active===false && t.date>=fromDate);
  targets.forEach(t=>{ t.amount=rule.amount; t.cat=rule.cat; t.sub=rule.sub; t.shop=rule.shop; t.item=rule.item; t.taxRate=rule.taxRate; });
  if(!sb||!SESSION) return Promise.resolve();
  setSync('save');
  const p1 = sb.from('kakeibo_rule').update({amount:rule.amount, cat:rule.cat, sub:rule.sub, shop:rule.shop, item:rule.item, tax_rate:rule.taxRate}).eq('id',ruleId).eq('user_id',SESSION.user.id);
  const ids = targets.map(t=>t.id);
  const p2 = ids.length ? sb.from('kakeibo_tx').update({amount:rule.amount, cat:rule.cat, sub:rule.sub, shop:rule.shop, item:rule.item, tax_rate:rule.taxRate}).in('id',ids).eq('user_id',SESSION.user.id) : Promise.resolve({});
  return Promise.all([p1,p2]).then(rs=>{ if(rs.some(x=>x&&x.error)) setSync('err'); else setSync('ok'); })
    .catch(e=>{ console.error(e); setSync('err'); });
}

/* 繰り返しをやめる：ルール無効化 + 未活性の予定分を削除。過去・活性分は残す */
function stopRule(ruleId){
  const rule = RULES.find(r=>r.id===ruleId); if(rule) rule.active=false;
  const doomed = TX.filter(t=>t.ruleId===ruleId && t.active===false);
  const ids = doomed.map(t=>t.id);
  TX = TX.filter(t=>!(t.ruleId===ruleId && t.active===false));  // ローカルから予定を除去
  if(!sb||!SESSION) return Promise.resolve();
  setSync('save');
  const p1 = sb.from('kakeibo_rule').update({active:false}).eq('id',ruleId).eq('user_id',SESSION.user.id);
  const p2 = ids.length ? sb.from('kakeibo_tx').delete().in('id',ids).eq('user_id',SESSION.user.id) : Promise.resolve({});
  return Promise.all([p1,p2]).then(rs=>{ if(rs.some(x=>x&&x.error)) setSync('err'); else setSync('ok'); })
    .catch(e=>{ console.error(e); setSync('err'); });
}

function loadAll(){
  if(!sb||!SESSION) return Promise.resolve();
  setSync('save');
  const p1 = sb.from('kakeibo_tx').select('*').eq('user_id',SESSION.user.id).order('date',{ascending:false})
    .then(r=>{ if(r.error) throw r.error; TX = (r.data||[]).map(rowToTx); });
  const p2 = sb.from('kakeibo_settings').select('data').eq('user_id',SESSION.user.id).maybeSingle()
    .then(r=>{ if(r.data && r.data.data && r.data.data.catTree) CAT_TREE = r.data.data.catTree;
      else { saveSettings(); } });
  const p3 = sb.from('kakeibo_income').select('*').eq('user_id',SESSION.user.id)
    .then(r=>{ if(r.error) throw r.error; INCOME = (r.data||[]).map(x=>({id:x.id, ym:x.ym, label:x.label, amount:x.amount})); });
  const p4 = sb.from('kakeibo_rule').select('*').eq('user_id',SESSION.user.id)
    .then(r=>{ if(r.error) throw r.error; RULES = (r.data||[]).map(rowToRule); });
  return Promise.all([p1,p2,p3,p4]).then(()=>{ promoteDue(); return ensureFuture(); }).then(()=>setSync('ok')).catch(e=>{ console.error(e); setSync('err'); });
}

/* 日付が到達した予定(active=false)を活性化する。0時判定の代わりに起動/月移動時に実行 */
function promoteDue(){
  const today = jstToday();
  const due = TX.filter(t=>t.active===false && t.date <= today);
  if(!due.length) return Promise.resolve();
  due.forEach(t=> t.active = true);          // ローカル即時反映
  if(!sb||!SESSION) return Promise.resolve();
  const ids = due.map(t=>t.id);
  return sb.from('kakeibo_tx').update({active:true}).in('id',ids).eq('user_id',SESSION.user.id)
    .then(r=>{ if(r.error) console.error(r.error); })
    .catch(e=>console.error(e));
}

function insertTx(rows){
  if(!sb||!SESSION){ // オフライン簡易フォールバック（ローカルのみ）
    rows.forEach(r=>TX.push(tx(r.date,r.amount,r.cat,r.sub,r.shop,r.item,r.taxRate,r.active,r.ruleId))); return Promise.resolve();
  }
  setSync('save');
  return sb.from('kakeibo_tx').insert(rows.map(txToRow)).select()
    .then(r=>{ if(r.error) throw r.error;
      (r.data||[]).forEach(row=>TX.push(rowToTx(row)));   // 実IDで反映
      setSync('ok'); if(TAB==='lens') renderLens(); if(TAB==='hist') renderHist();
    })
    .catch(e=>{ console.error(e); setSync('err'); });
}

function deleteTx(id){
  if(!sb||!SESSION){ TX=TX.filter(t=>t.id!==id); return Promise.resolve(); }
  setSync('save');
  return sb.from('kakeibo_tx').delete().eq('id',id).eq('user_id',SESSION.user.id)
    .then(r=>{ if(r.error) throw r.error; TX=TX.filter(t=>t.id!==id); setSync('ok'); })
    .catch(e=>{ console.error(e); setSync('err'); });
}

function updateTx(id, patch){
  // patch: {date, amount, cat, sub, shop, item, taxRate}
  const applyLocal=()=>{ const i=TX.findIndex(t=>t.id===id); if(i>=0) TX[i]={...TX[i], ...patch}; };
  if(!sb||!SESSION){ applyLocal(); return Promise.resolve(); }
  setSync('save');
  const row={date:patch.date, amount:patch.amount, cat:patch.cat, sub:patch.sub,
    shop:patch.shop, item:patch.item, tax_rate:patch.taxRate};
  if(patch.active!==undefined) row.active=patch.active;
  return sb.from('kakeibo_tx').update(row).eq('id',id).eq('user_id',SESSION.user.id)
    .then(r=>{ if(r.error) throw r.error; applyLocal(); setSync('ok');
      if(TAB==='lens') renderLens(); if(TAB==='hist') renderHist(); })
    .catch(e=>{ console.error(e); setSync('err'); });
}

function saveSettings(){
  if(!sb||!SESSION) return;
  setSync('save');
  sb.from('kakeibo_settings').upsert({user_id:SESSION.user.id, data:{catTree:CAT_TREE}, updated_at:new Date().toISOString()})
    .then(r=>setSync(r.error?'err':'ok'));
}

/* その月の収入を洗い替え保存（delete → insert）。rows: [{label, amount}] */
function saveIncome(ym, rows){
  // ローカル即時反映
  INCOME = INCOME.filter(x=>x.ym!==ym).concat(rows.map(r=>({id:'i'+Math.random().toString(36).slice(2,9), ym, label:r.label, amount:r.amount})));
  if(!sb||!SESSION) return Promise.resolve();
  setSync('save');
  return sb.from('kakeibo_income').delete().eq('user_id',SESSION.user.id).eq('ym',ym)
    .then(r=>{ if(r.error) throw r.error;
      if(!rows.length) return {data:[]};
      return sb.from('kakeibo_income').insert(rows.map(r=>({user_id:SESSION.user.id, ym, label:r.label, amount:r.amount}))).select();
    })
    .then(r=>{ if(r.error) throw r.error;
      // 実IDで置き換え
      INCOME = INCOME.filter(x=>x.ym!==ym).concat((r.data||[]).map(x=>({id:x.id, ym:x.ym, label:x.label, amount:x.amount})));
      setSync('ok');
    })
    .catch(e=>{ console.error(e); setSync('err'); });
}

/* ---- auth ---- */
function swapAuth(){
  AUTHMODE = AUTHMODE==='signin'?'signup':'signin';
  document.getElementById('authBtn').textContent = AUTHMODE==='signin'?'サインイン':'登録する';
  document.getElementById('authSwap').textContent = AUTHMODE==='signin'?'アカウントを作成する':'既にアカウントをお持ちの方';
  document.getElementById('authSub').textContent = AUTHMODE==='signin'?'サインインしてデータを同期します。':'新しいアカウントを作成します。';
  document.getElementById('authErr').textContent='';
  document.getElementById('authPw').setAttribute('autocomplete', AUTHMODE==='signin'?'current-password':'new-password');
}
function doAuth(){
  const email=document.getElementById('authEmail').value.trim();
  const pw=document.getElementById('authPw').value;
  const err=document.getElementById('authErr'); err.textContent='';
  if(!sb){ err.textContent='ライブラリを読み込めませんでした（本番URLでお試しください）。'; return; }
  if(!email||!pw){ err.textContent='メールとパスワードを入力してください。'; return; }
  const btn=document.getElementById('authBtn'); btn.disabled=true; btn.textContent='…';
  const p = AUTHMODE==='signin'
    ? sb.auth.signInWithPassword({email,password:pw})
    : sb.auth.signUp({email,password:pw});
  p.then(r=>{
    btn.disabled=false; btn.textContent=AUTHMODE==='signin'?'サインイン':'登録する';
    if(r.error){ err.textContent=r.error.message; return; }
    if(!r.data.session){ err.textContent='確認メールを送信しました。メール内のリンクを開いてから、サインインしてください。'; AUTHMODE='signin'; swapAuth(); swapAuth(); return; }
    enterApp(r.data.session);
  });
}
function enterApp(session){
  SESSION=session;
  document.getElementById('auth').classList.add('hidden');
  loadAll().then(()=>{ updatePeriodUI(); go('lens'); });
}
function signOut(){
  if(sb&&SESSION) sb.auth.signOut();
  SESSION=null; setSync(''); document.getElementById('auth').classList.remove('hidden');
}

document.getElementById('authBtn').onclick=doAuth;
document.getElementById('authSwap').onclick=swapAuth;
document.getElementById('authPw').addEventListener('keydown',e=>{ if(e.key==='Enter') doAuth(); });

/* init */
updatePeriodUI();
renderLens();   // 未サインインでも背後は空で描画
if(sb){
  sb.auth.getSession().then(r=>{ if(r.data && r.data.session) enterApp(r.data.session); });
}
</script>
